[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-studio"
version = "2.0.0"
description = "Local-first audio/video transcription studio with speaker diarization and multi-format export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rocío Jazmín Sánchez Suárez" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-docx>=1.1",
  "reportlab>=4.2",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
backup = ["openai-whisper>=20231117"]
cloud = ["openai>=1.40"]
diarization = ["pyannote.audio>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
antigravity-studio = "core.app:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.coverage.run]
source = ["backend"]
omit = ["*/__init__.py"]
